<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f32b95">
<title>El menú secreto de Misty</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #142b32;
}

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: white;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.game {
  width: min(100vw, 56.25svh);
  height: min(100svh, 177.7778vw);
  position: relative;
  overflow: hidden;
  background: #4dadaf;
  box-shadow: 0 0 70px #0008;
}

.screen {
  position: absolute;
  inset: 0;
  isolation: isolate;
}

.screen[hidden] {
  display: none;
}

.backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: -2;
  pointer-events: none;
  user-select: none;
}

.image-button {
  position: absolute;
  left: 12%;
  width: 76%;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  transition: transform .2s;
  filter: drop-shadow(0 4px 4px #6b20494d);
}

.image-button img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.image-button:hover {
  transform: scale(1.035);
}

.image-button:active {
  transform: scale(.96);
}

button:focus-visible {
  outline: 3px solid white;
  outline-offset: 3px;
}

.play {
  bottom: 7%;
  animation: breathe 2s ease-in-out infinite;
}

.choices {
  position: absolute;
  left: 1.5%;
  right: 1.5%;
  top: 49.6%;
  height: 40.8%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, 1fr);
  gap: 1.1% 2.5%;
}

.choices button {
  border: 3px solid transparent;
  border-radius: 16%;
  background: transparent;
  cursor: pointer;
  transition:
    background .2s,
    box-shadow .2s,
    transform .2s;
}

.choices button:hover,
.choices button:focus-visible {
  background: #fff2;
  box-shadow: inset 0 0 16px #fff9;
}

.choices button.chosen {
  border-color: #ffe47c;
  box-shadow:
    0 0 24px #fff38b,
    inset 0 0 20px #fff8;
  animation: breathe .5s ease-in-out infinite;
}

.choices button:disabled {
  cursor: default;
}

.selecting {
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: 2%;
  padding: 10px;
  border-radius: 16px;
  background: #91215de8;
  text-align: center;
  font-size: clamp(12px, 2.5svh, 20px);
  font-weight: bold;
}

.misty {
  position: absolute;
  left: 19%;
  top: 22%;
  width: 62%;
  height: 47%;
  object-fit: contain;
  pointer-events: none;
}

.misty.enter {
  animation: arrive .6s ease-out;
}

.prize-card {
  position: absolute;
  top: 70%;
  left: 8%;
  width: 84%;
  padding: 8px;
  border-radius: 18px;
  background: #fff0f8ed;
  color: #812352;
  text-align: center;
  box-shadow: 0 3px 12px #64244733;
}

.prize-card span {
  font-size: clamp(10px, 1.7svh, 15px);
}

.prize-card h1 {
  margin: 3px 0;
  color: #ed258d;
  font-size: clamp(22px, 4.5svh, 42px);
}

.prize-card p {
  margin: 0;
  font-size: clamp(12px, 2svh, 18px);
  font-weight: bold;
}

.claim {
  bottom: 6%;
  left: 10%;
  width: 80%;
}

.again {
  position: absolute;
  bottom: 1.6%;
  left: 24%;
  width: 52%;
  padding: 6px;
  border: 0;
  border-radius: 20px;
  background: #fffdeb;
  color: #7a2850;
  font-weight: bold;
  cursor: pointer;
}

#confetti {
  position: absolute;
  inset: 0;
  z-index: 3;
  overflow: hidden;
  pointer-events: none;
}

#confetti i {
  position: absolute;
  top: -20px;
  width: 7px;
  height: 12px;
  animation: fall 3s linear both;
}

@keyframes breathe {
  50% {
    transform: scale(1.035);
  }
}

@keyframes arrive {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.9);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fall {
  to {
    transform: translateY(105svh) rotate(600deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="game" aria-label="El menú secreto de Misty">

  <!-- PANTALLA DE INICIO -->
  <section
    id="inicio"
    class="screen"
    aria-label="Inicio"
  >
    <img
      class="backdrop"
      src="inicio.png"
      alt="Misty te da la bienvenida a su restaurante de pescados"
      draggable="false"
    >

    <button
      id="play"
      class="image-button play"
      type="button"
      aria-label="Iniciar juego"
    >
      <img
        src="boton_inicio.png"
        alt="Inicio"
        draggable="false"
      >
    </button>
  </section>

  <!-- PANTALLA DE ELECCIÓN -->
  <section
    id="eleccion"
    class="screen"
    aria-label="Elegí un pescado"
    hidden
  >
    <img
      class="backdrop"
      src="eleccion.png"
      alt="Misty frente a seis bandejas de pescados"
      draggable="false"
    >

    <div class="choices">

      <!-- ARRIBA IZQUIERDA -->
      <button
        type="button"
        data-fish="0"
        aria-label="Elegir pescado común"
      ></button>

      <!-- ARRIBA DERECHA -->
      <button
        type="button"
        data-fish="1"
        aria-label="Elegir sardinas"
      ></button>

      <!-- MEDIO IZQUIERDA -->
      <button
        type="button"
        data-fish="2"
        aria-label="Elegir atún"
      ></button>

      <!-- MEDIO DERECHA -->
      <button
        type="button"
        data-fish="3"
        aria-label="Elegir salmón"
      ></button>

      <!-- ABAJO IZQUIERDA -->
      <button
        type="button"
        data-fish="4"
        aria-label="Elegir pez globo"
      ></button>

      <!-- ABAJO DERECHA -->
      <button
        type="button"
        data-fish="5"
        aria-label="Elegir merluza"
      ></button>

    </div>

    <div
      id="selecting"
      class="selecting"
      role="status"
      hidden
    >
      ¡Misty está preparando tu sorpresa! 🐟
    </div>
  </section>

  <!-- PANTALLA DE PREMIO -->
  <section
    id="resultado"
    class="screen"
    aria-label="Tu premio"
    hidden
  >
    <img
      class="backdrop"
      src="premio.png"
      alt="Restaurante con cartel ¡Ganaste!"
      draggable="false"
    >

    <div id="confetti" aria-hidden="true"></div>

    <img
      id="misty"
      class="misty"
      alt=""
      draggable="false"
    >

    <div class="prize-card" aria-live="polite">
      <span id="fish-name"></span>
      <h1 id="prize"></h1>
      <p id="detail"></p>
    </div>

    <button
      id="claim"
      class="image-button claim"
      type="button"
      aria-label="Reclamar premio por WhatsApp"
    >
      <img
        src="boton_reclamar.png"
        alt="Reclamar premio"
        draggable="false"
      >
    </button>

    <button
      id="again"
      class="again"
      type="button"
    >
      Volver a probar
    </button>
  </section>

</main>

<script>
"use strict";

/* PREMIOS Y LÍNEAS DE WHATSAPP */
const fishes = [
  {
    name: "Pescado común",
    image: "misty_pescado.png",
    prize: "500 fichas",
    detail: "¡Disfrutá tu premio!",
    whatsapp: "https://wa.link/drywhr"
  },
  {
    name: "Sardinas",
    image: "misty_sardinas.png",
    prize: "1000 fichas",
    detail: "¡Disfrutá tu premio!",
    whatsapp: "https://wa.link/ngurrb"
  },
  {
    name: "Atún",
    image: "misty_atun.png",
    prize: "10%",
    detail: "En tu próxima carga",
    whatsapp: "https://wa.link/rbrp20"
  },
  {
    name: "Salmón",
    image: "misty_salmon.png",
    prize: "15%",
    detail: "En tu próxima carga",
    whatsapp: "https://wa.link/x23wy4"
  },
  {
    name: "Pez globo",
    image: "misty_pezglobo.png",
    prize: "20%",
    detail: "En tu próxima carga",
    whatsapp: "https://wa.link/3fyk7i"
  },
  {
    name: "Merluza",
    image: "misty_merluza.png",
    prize: "25%",
    detail: "En tu próxima carga",
    whatsapp: "https://wa.link/qf3qz7"
  }
];

const get = id => document.getElementById(id);

const choiceButtons = document.querySelectorAll(
  "[data-fish]"
);

let busy = false;
let selected = null;

/* CAMBIO DE PANTALLA */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.hidden = screen.id !== id;
  });
}

/* PRECARGA DE IMÁGENES */
[
  "eleccion.png",
  "premio.png",
  "boton_reclamar.png",
  ...fishes.map(fish => fish.image)
].forEach(source => {
  const image = new Image();
  image.src = source;
});

/* INICIAR */
get("play").addEventListener("click", () => {
  showScreen("eleccion");
  choiceButtons[0].focus({ preventScroll: true });
});

/* ELEGIR PESCADO */
choiceButtons.forEach(button => {
  button.addEventListener("click", () => {
    if (busy) return;

    busy = true;
    selected = fishes[Number(button.dataset.fish)];

    choiceButtons.forEach(otherButton => {
      otherButton.disabled = true;

      otherButton.classList.toggle(
        "chosen",
        otherButton === button
      );
    });

    get("selecting").hidden = false;

    window.setTimeout(() => {
      const misty = get("misty");

      misty.classList.remove("enter");
      misty.src = selected.image;

      misty.alt =
        "Misty sosteniendo " +
        selected.name.toLowerCase();

      get("fish-name").textContent =
        "Elegiste: " + selected.name;

      get("prize").textContent = selected.prize;
      get("detail").textContent = selected.detail;

      showScreen("resultado");

      void misty.offsetWidth;
      misty.classList.add("enter");

      celebrate();

      get("claim").focus({ preventScroll: true });
    }, 1100);
  });
});

/* CONFETI */
function celebrate() {
  const container = get("confetti");
  container.replaceChildren();

  if (
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches
  ) {
    return;
  }

  const colors = [
    "#ff4fac",
    "#ffd16c",
    "#36d7db"
  ];

  for (let index = 0; index < 30; index++) {
    const piece = document.createElement("i");

    piece.style.left =
      Math.random() * 100 + "%";

    piece.style.background =
      colors[index % colors.length];

    piece.style.animationDelay =
      Math.random() * 1.2 + "s";

    piece.style.animationDuration =
      2 + Math.random() * 2 + "s";

    container.appendChild(piece);
  }
}

/* REPETIR DURANTE LAS PRUEBAS */
get("again").addEventListener("click", () => {
  busy = false;
  selected = null;

  get("selecting").hidden = true;
  get("confetti").replaceChildren();

  choiceButtons.forEach(button => {
    button.disabled = false;
    button.classList.remove("chosen");
  });

  showScreen("eleccion");

  choiceButtons[0].focus({ preventScroll: true });
});

/* RECLAMAR EN LA LÍNEA CORRESPONDIENTE */
get("claim").addEventListener("click", () => {
  if (!selected) return;

  window.location.assign(selected.whatsapp);
});
</script>

</body>
</html>
